name: CI — Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (confirma que compila sem erros)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://www.dsprojects.pt"
